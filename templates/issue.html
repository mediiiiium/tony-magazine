<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Tony Magazine 第{{ISSUE_NO}}号</title>
<meta name="description" content="{{LEAD}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body style="--accent:{{ACCENT}}">
<header class="hero{{HERO_CLASS}}"{{HERO_STYLE}}>
{{HERO_GLYPH}}
  <div class="hero-top"><a class="masthead" href="../index.html">Tony Magazine</a><span>第 {{ISSUE_NO}} 号　{{DATE_JA}}</span></div>
  <div class="hero-inner"><p class="kicker">{{TOPIC}}</p><h1>{{TITLE}}</h1></div>
{{HERO_CREDIT}}
</header>
<div class="wrap">
  <div class="after-hero measure"><p class="lead">{{LEAD}}</p></div>
  <main class="measure">
{{BODY}}
  </main>
</div>
{{TOPICS}}
<div class="wrap">
  <footer><div class="wrap measure">
    <a href="../index.html">← 目次へもどる</a>
    <p class="colophon">Tony Magazine — 毎週日曜、興味の一歩先へ寄り道する個人誌。<br>
    この号は Claude が Web 上の公開情報を調べて編集しました。事実関係は末尾のソースを参照してください。{{CREDIT_LINE}}</p>
  </div></footer>
</div>
</body>
</html>
