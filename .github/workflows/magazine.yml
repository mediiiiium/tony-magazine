name: Magazine

# 週刊個人誌「Tony Magazine」。毎週日曜朝に claude -p（サブスク枠・Web検索つき）が
# 「普段触れないジャンル」を1つ調査して誌面を発行し、Pushover（iPhone）に通知する。
# 流儀は tony の brief/report と同じ: LLM失敗でも黙らない（必ず Pushover に何か言う）。
on:
  schedule:
    - cron: '0 21 * * 6'   # UTC土 21:00 = JST日曜 6:00（遅延込みで朝に届く）
  workflow_dispatch:        # 手動発行（動作確認用）

permissions:
  contents: write           # 発行した号を docs/ に push するため

concurrency:
  group: magazine
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 発行情報を決める
        id: meta
        run: |
          echo "slug=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "date_ja=$(TZ=Asia/Tokyo date '+%Y年%-m月%-d日')" >> "$GITHUB_OUTPUT"

      # 連載「今週の若手」の1人をデータで選ぶ（ESPN の公開 JSON）。コケたら若手欄なしで発行する
      - name: 今週の若手を選ぶ
        continue-on-error: true
        env:
          DATE_SLUG: ${{ steps.meta.outputs.slug }}
        run: python scripts/scout.py

      - name: プロンプトを組み立てる
        env:
          DATE_JA: ${{ steps.meta.outputs.date_ja }}
          DATE_SLUG: ${{ steps.meta.outputs.slug }}
        run: python scripts/make_prompt.py

      - name: Claude Code をインストール
        run: npm install -g @anthropic-ai/claude-code

      # サブスク枠(CLAUDE_CODE_OAUTH_TOKEN)。Web検索と参照ページの読み込みだけ許可。
      # 失敗しても続行し、通知ステップが「発行できなかった」と必ず知らせる。
      - name: claude -p で今週号を執筆
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p "$(cat prompt.txt)" \
            --allowedTools "WebSearch,WebFetch" \
            --output-format text > issue_raw.txt 2> issue_err.txt
          rc=$?
          set -e
          echo "--- 終了コード $rc / 原稿 $(wc -c < issue_raw.txt) bytes ---"
          if [ $rc -ne 0 ]; then
            echo "--- stderr ---"; head -c 2000 issue_err.txt
            : > issue_raw.txt
            exit $rc
          fi

      # 扉の1枚。Met の Open Access → Wikimedia Commons の順に探す。
      # ここはコケてよい（build 側が「題を一字置く扉」に切り替えて通知で知らせる）。
      - name: 扉の図版を用意する
        continue-on-error: true
        env:
          DATE_SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          pip install --quiet pillow numpy
          python scripts/fetch_hero.py

      - name: 誌面を組む（検品・サニタイズ込み）
        id: build
        continue-on-error: true
        env:
          DATE_SLUG: ${{ steps.meta.outputs.slug }}
          DATE_JA: ${{ steps.meta.outputs.date_ja }}
        run: python scripts/build_issue.py

      - name: Pages へ発行（docs/ を push）
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "tony-magazine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs archive
          if [ -d data ]; then git add data; fi   # scout.py が貯めた試合データ（次週は差分だけ取る）
          git commit -m "発行: ${{ steps.meta.outputs.slug }} 号"
          git push

      # 検品で弾かれた号でも、LLM が何を書いてきたかは残す。発行ステップは
      # build 成功が条件なので、これが無いと没原稿はランナーごと消えてしまう。
      - name: 没になった原稿だけ残す
        if: steps.build.outcome != 'success'
        run: |
          git config user.name "tony-magazine-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain archive)" ]; then
            git add archive
            git commit -m "没: ${{ steps.meta.outputs.slug }} 号の原稿（検品で弾かれた）"
            git push
          else
            echo "残す原稿なし（claude -p の段階で失敗）"
          fi

      # 連載「今週の若手」を息子の Slack DM へ。ここは落ちても続ける
      # （送れたかどうかは son_result.json 経由で、次の Pushover 通知に一言添える）
      - name: 息子の Slack へ若手欄を送る
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_SON_USER_ID: ${{ secrets.SLACK_SON_USER_ID }}
        run: python scripts/notify_son.py

      # ★このステップは絶対に飛ばさない。成功でも失敗でも必ず Pushover に知らせる。
      #   Pushover に送れなかったらこのステップが落ちて workflow が赤くなる（GitHub アプリで気づく）。
      - name: Pushover へ通知
        if: always()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python scripts/notify.py
